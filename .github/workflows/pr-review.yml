# 人間が作った PR を Claude がレビューする。
#
# 実体は再利用可能ワークフローに切り出してある。
#   https://github.com/tamura09/claude-pr-review
#
# レビューを投稿するだけで、マージも承認もしない。判断するのは人間。
#
# レビューされない PR が2種類ある。
#   - fork からの PR。GitHub が secrets も id-token も渡さないため、この経路では
#     起動できない。呼び出し先が head.repo をみて明示的にスキップする
#   - Dependabot の PR。同じ制限を受けるので、既定の skip_authors に入っている
#
# OAuth トークンはこのリポジトリの secret には置かない。AWS の SSM
# (/claude-pr-review/oauth-token) に1本だけ置いてあり、呼び出された
# ワークフローが OIDC で読む。下の id-token: write がそのために要る。
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられないため、ここで明示する
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review チェックを PR のチェック一覧に出すため
  statuses: write
  # OAuth トークンを SSM から読むための OIDC トークン発行
  id-token: write
  # CI の実行結果を Claude に読ませるため (github_ci MCP に必要)
  actions: read

# 連続 push のたびに走らせず、最新のコミットだけレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # id-token: write を渡す呼び出し先なので、コミット SHA で固定する。
    #
    # 以前はここを @v1 のままにしていた。理由は「タグを書き換えられる相手はこの
    # ファイル自体も書き換えられるので、SHA 固定で防げる相手が今はいない」という
    # もので、前提は両方のリポジトリの書き込み権限者が一致していることだった。
    # collaborator はリポジトリ単位なので、どちらか一方にだけ人を足した時点で
    # この前提は崩れる。固定を避けていたのは、直すたびに全リポジトリの参照を手で
    # 書き換えることになるからだったが、それは共有プリセット
    # (presets/default.json5) が tamura09/** の digest 更新として自動で追うように
    # なったので、もう理由にならない。
    #
    # 版のコメントは同じ行の末尾に置く。Renovate の github-actions マネージャは
    # そこからしかタグを読まない。前の行に書くと、どのタグの digest なのかを
    # 解決できず、v1 ではなくデフォルトブランチの先頭を追いにいく。
    uses: tamura09/claude-pr-review/.github/workflows/pr-review.yml@6f56b8cf902b0c79f44d42a05bd3cc3a610f31f1 # v1
