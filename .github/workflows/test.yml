name: Test lockfile summary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test lockfile summaries
        run: |
          python3 -m venv "${RUNNER_TEMP}/lockfile-summary-venv"
          "${RUNNER_TEMP}/lockfile-summary-venv/bin/pip" install --require-hashes --only-binary=:all: -r requirements.txt
          "${RUNNER_TEMP}/lockfile-summary-venv/bin/python" -m unittest discover -s tests -v
