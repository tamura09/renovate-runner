# アカウント全体の依存更新をまとめて回す Renovate。
#
# 各リポジトリにワークフローは置かない。ここ1本が RENOVATE_REPOSITORIES に
# 載っているリポジトリを1つずつ別ジョブにして並列に見て、更新があれば PR を作る。
#
# 対象リポジトリの一覧は tamura09/terraform の github/ root が Actions の変数に書く。
# locals.tf の enable_renovate が true のリポジトリだけが載る。既定は無効。
#
# Renovate は GitHub App (tamura09-renovate) として動く。秘密鍵はこのリポジトリの
# secret には置かない。AWS の SSM (/renovate/app-private-key) に1本だけ置いてあり、
# OIDC で github-actions-renovate ロールを引いて読む。下の id-token: write が
# そのために要る。鍵から installation access token を作り、Renovate に渡す。
#
# Client ID は秘密ではないのでここに直接書く。秘密鍵が無ければ ID だけでは何も
# できない。
#
# 使う action はすべてコミット SHA で固定する。共有プリセットの
# helpers:pinGitHubActionDigests で全リポジトリがそうなるが、ここは特に、
# Renovate を有効にした全リポジトリへ書き込める token を扱うので、タグの
# 書き換えがそのままトークンの流出になる。checkout は config.js の中身を、
# configure-aws-credentials は SSM への到達手段を、create-github-app-token は
# 秘密鍵そのものを握っている。
#
# 毎日2回走らせているが、ほとんどの PR が出るのは月曜だけ。実際にいつ作るかは
# 共有プリセット (presets/default.json5) の schedule が決める。毎日走らせるのは
# Dependency Dashboard のチェックボックス操作や、閉じた PR の作り直しに
# 週1では反応が遅いため。
#
# 1日2回にしてあるのは、**自動マージが1回の実行では完結しない**ため。Renovate は
# PR を作った時点ではチェックが走っていないのでマージできず、マージは次の実行に
# なる。1日1回だと claude-pr-review の更新が全リポジトリに届くのに2日かかる。
# 2回にすると、作成と取り込みが同じ日に収まる。
#
# GitHub 側の auto-merge (allow_auto_merge) を使えば1回で済むが、それはやらない。
# Renovate のドキュメントが警告しているとおり、必須ステータスチェックが無いまま
# platform automerge を使うと、チェックの完了を待たずにマージされうる。この
# アカウントは大半のリポジトリが必須チェックを設けていない。
name: Renovate

on:
  schedule:
    # 08:00 JST (前日 23:00Z) と 12:00 JST (03:00Z)。JST では同じ日の2回になる。
    #
    # 前半で PR を作り、後半でチェックが通ったものを取り込む。プリセットの
    # schedule ("on monday") は JST の月曜1日が窓なので、どちらも同じ窓に入る。
    #
    # 4時間空けてあるのは、GitHub Actions の schedule が遅れるため。実測で
    # 1時間48分ずれたことがある (下の workflow_dispatch の項を参照)。間隔が遅延より
    # 短いと、1本目が発火する前に2本目がトリガーされ、concurrency のキューで
    # 「取り込み→作成」の順に入れ替わる。その日は取り込みが起きない。
    #
    # 4時間遅れることは観測していないが、仮に後半が2時間遅れても 14:00 JST で、
    # 月曜のうちに収まる。
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "PR を作らず、何をするかだけログに出す"
        type: boolean
        default: false

# このワークフロー自体は GitHub に何も書かない。リポジトリを書き換えるのは
# App の installation token の権限で、GITHUB_TOKEN ではない。
permissions:
  contents: read
  id-token: write

# 同時に2本のworkflow runは走らせない。run内のジョブはリポジトリが重複しないので
# 並列にしてよい。別runが同じリポジトリを触ると PR が二重になる。
concurrency:
  group: renovate
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::222165754930:role/github-actions-renovate
  # tamura09-renovate App の Client ID (App ID は 4847603)。create-github-app-token は
  # app-id を deprecated にしていて、client-id を使う。
  RENOVATE_APP_CLIENT_ID: Iv23liMXUkOapjdcfgG4
  RENOVATE_APP_PRIVATE_KEY_PARAMETER: /renovate/app-private-key

jobs:
  prepare:
    name: List Renovate repositories
    runs-on: ubuntu-26.04-arm
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}
    defaults:
      run:
        shell: bash

    steps:
      # 以前は一覧を固定数の shard に round-robin で分けていたが、所要時間は
      # リポジトリごとに2桁違う (2026-09-24 時点で cost-notify が約16分、大半は1分未満)。
      # 重いリポジトリと同じ shard に入ったものが巻き添えで待たされ、
      # shard 間で最大4倍の差が出ていた。shard を増やしても、どこかの shard に
      # 重いものが偏る点は変わらない。
      #
      # 1リポジトリ1ジョブにして同時実行数だけ max-parallel で絞ると、空いた枠から
      # 次のリポジトリを拾うワーカープールになる。全体の所要時間は、最も重い
      # 1リポジトリの時間まで縮む。
      - name: Split the repository list
        id: repositories
        env:
          RENOVATE_REPOSITORIES: ${{ vars.RENOVATE_REPOSITORIES }}
        run: |
          set -euo pipefail

          if [ -z "${RENOVATE_REPOSITORIES}" ]; then
            echo "::error::RENOVATE_REPOSITORIES が空です。" \
                 "tamura09/terraform の github/locals.tf で enable_renovate を true にして" \
                 "apply すると、この変数に対象リポジトリが載ります。"
            exit 1
          fi

          repositories="$(jq -Rc 'split(",") | map(select(length > 0))' <<< "${RENOVATE_REPOSITORIES}")"
          echo "対象リポジトリ数: $(jq length <<< "${repositories}")"
          echo "repositories=${repositories}" >> "${GITHUB_OUTPUT}"

  renovate:
    name: Renovate (${{ matrix.repository }})
    needs: prepare
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      # 個人アカウントの Actions は全リポジトリ合わせて同時20ジョブまで。Renovate で
      # 埋め尽くすと、同じ時間帯の Lambda の Build や Terraform の apply が待たされる。
      # 重いリポジトリ以外は数十秒で終わるので、6本あれば最も重い1本が終わるより
      # 先に残りが捌ける。
      max-parallel: 6
      matrix:
        repository: ${{ fromJSON(needs.prepare.outputs.repositories) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install verified wheels before fetching credentials or the App token.
      - name: Install lockfile summary dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/lockfile-summary-venv"
          "${RUNNER_TEMP}/lockfile-summary-venv/bin/pip" install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # App の秘密鍵はリポジトリの secret には置かず、SSM から読みます。
      #
      # 鍵は GITHUB_ENV ではなくこのステップの output で渡します。GITHUB_ENV に
      # 書くと以降の全ステップに見え、RENOVATE_ で始まる名前は
      # renovatebot/github-action が Renovate のコンテナへそのまま渡します。
      # コンテナの中では対象リポジトリの内容を処理し、ツールを取ってきて実行するので、
      # そこに失効しない App の鍵を置かないようにします。
      - name: Read the GitHub App private key from SSM
        id: app_key
        run: |
          set -euo pipefail

          key="$(aws ssm get-parameter \
            --name "${RENOVATE_APP_PRIVATE_KEY_PARAMETER}" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"

          if [ -z "${key}" ] || [ "${key}" = "MANAGED_OUTSIDE_TERRAFORM" ]; then
            echo "::error::${RENOVATE_APP_PRIVATE_KEY_PARAMETER} (${AWS_REGION}) はまだ実際の鍵で埋められていません。" \
                 "tamura09-renovate App の private key を発行し、" \
                 "aws ssm put-parameter --region ${AWS_REGION} --overwrite で投入してください。"
            exit 1
          fi

          # PEM は複数行なので1行ずつマスクします。::add-mask:: は改行を含む値を
          # 1つのマスクとして扱えません。
          while IFS= read -r line; do
            [ -n "${line}" ] && echo "::add-mask::${line}"
          done <<< "${key}"

          {
            echo "private_key<<PEM_EOF"
            echo "${key}"
            echo "PEM_EOF"
          } >> "${GITHUB_OUTPUT}"

      # 秘密鍵から installation access token を作ります。owner を渡すと、この
      # アカウントに App がインストールされているリポジトリすべてを対象にした
      # token になります。渡さないと実行中のリポジトリだけになり、他のリポジトリを
      # 更新できません。
      #
      # token の寿命は1時間です。1回の実行がそれを超えると途中で失効します。
      #
      - name: Mint an installation token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ steps.app_key.outputs.private_key }}
          owner: tamura09

      # リポジトリごとに、人間の contributor のうちコミット数が最多の1人を選ぶ。
      # 全ページを取得し、同数なら login の昇順で決める。bot・匿名 contributor は除く。
      - name: Select the top contributor as reviewer
        id: reviewer
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail

          reviewer="$(gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/contributors?per_page=100" \
            | jq -r '[.[][] | select(.type == "User" and .login != null)]
              | sort_by(-.contributions, .login) | .[0].login // empty')"

          if [ -z "${reviewer}" ]; then
            echo "::warning::レビュー依頼できる contributor が見つかりませんでした。"
          fi
          echo "login=${reviewer}" >> "${GITHUB_OUTPUT}"

      # OSV は直接依存だけを検査するため、Trivy が lockfile の間接依存に
      # 見つけた脆弱性は通常の更新 PR では直らないことがある。スキャナ本人の
      # 未解決の依存 issue がある場合だけ、週次の lockfile 更新を前倒しする。
      # API の失敗はエラーにして、検査できなかった状態を「問題なし」にしない。
      - name: Check dependency security findings
        id: security_findings
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail

          rules="$(gh api --paginate --slurp \
            "repos/${TARGET_REPOSITORY}/issues?state=open&labels=security-scan,surface%3Adeps&per_page=100" \
            | jq -c 'if any(.[][];
                .user.login == "tamura09-security-scan[bot]"
                and .pull_request == null
                and ([.labels[].name] | index("false-positive") == null and index("accepted-risk") == null))
              then [{matchUpdateTypes: ["lockFileMaintenance"],
                     force: {enabled: true, schedule: ["at any time"], minimumReleaseAge: null,
                             prConcurrentLimit: 0, automerge: false}}]
              else [] end')"
          echo "package_rules=${rules}" >> "${GITHUB_OUTPUT}"

      # Feed the previous summary into Renovate's native body template so an
      # unchanged run does not remove it and trigger a second body edit.
      - name: Preserve lockfile summaries in Renovate notes
        id: lockfile_notes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          EXISTING_PACKAGE_RULES: ${{ steps.security_findings.outputs.package_rules }}
        run: '"${RUNNER_TEMP}/lockfile-summary-venv/bin/python" scripts/lockfile_summary.py --prepare-rules'

      # 4つの action の digest は Renovate 自身が追う。共有プリセットが
      # github-actions の digest 更新をグループに含めている。版は `uses:` の行末に
      # 書く。Renovate はそこからしかタグを読まず、前の行に書くとタグではなく
      # デフォルトブランチの先頭を追いにいく。
      - name: Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: config.js
          token: ${{ steps.app_token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ matrix.repository }}
          RENOVATE_REVIEWERS: ${{ steps.reviewer.outputs.login }}
          # 自動マージ対象の PR にも、作成時にレビューを依頼する。
          RENOVATE_ASSIGN_AUTOMERGE: 'true'

          # slim イメージなので、terraform や npm は必要になった時点で入れる。
          # これが無いと .terraform.lock.hcl や package-lock.json を更新できない。
          RENOVATE_BINARY_SOURCE: install

          # lockfile 更新だけを強制し、既定のブランチ名や repo 固有の設定は維持する。
          RENOVATE_PACKAGE_RULES: ${{ steps.lockfile_notes.outputs.package_rules }}

          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || 'null' }}
          LOG_LEVEL: info

      # Renovate の lockfile maintenance 本文には更新された版が載らないため、
      # PR の merge base と head の lockfile を比較して本文を補足する。
      # 他リポジトリのコードや依存インストールは実行しない。
      - name: Summarize lockfile version changes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: |
          "${RUNNER_TEMP}/lockfile-summary-venv/bin/python" scripts/lockfile_summary.py
